<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Account — Clean AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Blocks the page until auth check resolves (avoids flashing content). -->
  <div class="loading-full" id="gate"><div class="spinner"></div></div>

  <main class="wrap wide" id="app" style="visibility:hidden;">
    <div class="brand" style="justify-content:flex-start;">
      <div class="logo">C</div>
      <div class="name">Clean<span>AI</span></div>
    </div>

    <div class="acct-head">
      <div>
        <h1>Your account</h1>
        <div class="email" id="acctEmail"></div>
      </div>
      <button class="btn ghost" id="logoutBtn" style="width:auto;">Log out</button>
    </div>

    <div class="alert" id="alert"></div>

    <div class="panel">
      <div class="label">Subscription</div>
      <div class="row-between">
        <span id="statusBadge" class="badge none"><span class="pip"></span>None</span>
        <button class="btn" id="manageBtn" style="width:auto;">Manage subscription</button>
      </div>
    </div>

    <div class="panel">
      <div class="label">Licence key</div>
      <div class="key-row">
        <span class="key-val masked" id="keyVal" title="Click to reveal">•••• •••• •••• ••••</span>
        <button class="icon-btn" id="revealBtn">reveal</button>
        <button class="icon-btn" id="copyBtn">copy</button>
      </div>
      <p class="hint">Use this key to activate the Clean AI desktop app. Click the key to reveal it.</p>
    </div>

    <p class="hint" style="text-align:center;margin-top:14px;">
      No tracking. No analytics. Your files never leave your machine.
    </p>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    (async function () {
      const { sb, $, showAlert, clearAlert, getOrCreateLicense, requireAuth, friendlyError } = window.CleanAI;

      const session = await requireAuth("login.html");
      if (!session) return; // redirected

      const user = session.user;
      let realKey = "";
      let revealed = false;

      // Reveal the app once we know the user is authed.
      $("#gate").remove();
      $("#app").style.visibility = "visible";

      $("#acctEmail").textContent = user.email;

      // ---- licence + status ----
      try {
        const lic = await getOrCreateLicense(user);
        realKey = lic.key;

        const status = (lic.status || "none").toLowerCase();
        const badge = $("#statusBadge");
        if (status === "active") {
          badge.className = "badge active";
          badge.innerHTML = '<span class="pip"></span>Active';
        } else if (status === "trial") {
          badge.className = "badge trial";
          badge.innerHTML = '<span class="pip"></span>Trial';
        } else {
          badge.className = "badge none";
          badge.innerHTML = '<span class="pip"></span>None';
        }
      } catch (err) {
        showAlert($("#alert"), "Couldn't load your licence: " + friendlyError(err), "error");
      }

      // ---- reveal / mask licence key ----
      const keyEl = $("#keyVal");
      const revealBtn = $("#revealBtn");
      function renderKey() {
        if (!realKey) { keyEl.textContent = "—"; return; }
        if (revealed) {
          keyEl.textContent = realKey;
          keyEl.classList.remove("masked");
          revealBtn.textContent = "hide";
        } else {
          keyEl.textContent = "•••• •••• •••• ••••";
          keyEl.classList.add("masked");
          revealBtn.textContent = "reveal";
        }
      }
      function toggleReveal() { if (realKey) { revealed = !revealed; renderKey(); } }
      revealBtn.addEventListener("click", toggleReveal);
      keyEl.addEventListener("click", toggleReveal);

      // ---- copy ----
      const copyBtn = $("#copyBtn");
      copyBtn.addEventListener("click", async () => {
        if (!realKey) return;
        try {
          await navigator.clipboard.writeText(realKey);
          copyBtn.textContent = "copied";
          copyBtn.classList.add("copied");
          setTimeout(() => { copyBtn.textContent = "copy"; copyBtn.classList.remove("copied"); }, 1600);
        } catch {
          // Clipboard blocked — reveal so the user can copy manually.
          revealed = true; renderKey();
        }
      });

      // ---- manage subscription (stub) ----
      $("#manageBtn").addEventListener("click", () => {
        showAlert($("#alert"), "Billing isn't wired up yet — subscription management is coming soon.", "ok");
      });

      // ---- logout ----
      $("#logoutBtn").addEventListener("click", async () => {
        await sb.auth.signOut();
        window.location.replace("login.html");
      });
    })();
  </script>
</body>
</html>
